<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MEEF Kitchen – Build Your Order</title>

  <!-- Static Tailwind CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css"
    rel="stylesheet"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #f8f5f2; }
    .flavor-card { transition: all 0.3s ease; }
    .flavor-card:hover { transform: translateY(-5px); }
    .flavor-indicator { width:20px; height:20px; border-radius:50%; display:inline-block; margin-right:8px; }
  </style>
</head>
<body>
  <div class="min-h-screen">
    <!-- Header -->
    <header class="bg-amber-800 text-white py-6">
      <div class="container mx-auto px-4">
        <h1 class="text-3xl md:text-4xl font-bold text-center">MEEF Kitchen</h1>
        <p class="text-center mt-2 text-amber-200 font-light">Craft Your Perfect Smoked Turkey</p>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
      <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
        <h2 class="text-2xl font-semibold mb-6 text-amber-900 border-b pb-2">Build Your Order</h2>

        <!-- Flavor Selection -->
        <div class="mb-8">
          <h3 class="text-lg font-medium mb-4 text-amber-800">Select Your Flavor</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="flavor-card border rounded-lg p-4 cursor-pointer" data-flavor="Cajun">
              <div class="flex items-center mb-2">
                <span class="flavor-indicator bg-red-600"></span><h4 class="font-medium">Cajun</h4>
              </div>
              <p class="text-sm text-gray-600 mb-3">Bold, spicy blend</p>
            </div>
            <div class="flavor-card border rounded-lg p-4 cursor-pointer" data-flavor="Lemon Pepper">
              <div class="flex items-center mb-2">
                <span class="flavor-indicator bg-yellow-400"></span><h4 class="font-medium">Lemon Pepper</h4>
              </div>
              <p class="text-sm text-gray-600 mb-3">Zesty citrus</p>
            </div>
            <div class="flavor-card border rounded-lg p-4 cursor-pointer" data-flavor="Honey Mustard">
              <div class="flex items-center mb-2">
                <span class="flavor-indicator bg-amber-300"></span><h4 class="font-medium">Honey Mustard</h4>
              </div>
              <p class="text-sm text-gray-600 mb-3">Sweet & tangy</p>
            </div>
            <div class="flavor-card border rounded-lg p-4 cursor-pointer" data-flavor="BBQ">
              <div class="flex items-center mb-2">
                <span class="flavor-indicator bg-red-800"></span><h4 class="font-medium">BBQ</h4>
              </div>
              <p class="text-sm text-gray-600 mb-3">Smoky & sweet</p>
            </div>
          </div>
        </div>

        <!-- Quantity -->
        <div class="mb-8">
          <h3 class="text-lg font-medium mb-4 text-amber-800">Quantity</h3>
          <div class="flex items-center">
            <button id="decreaseBtn" class="bg-amber-100 text-amber-800 px-4 py-2 rounded-l-md border border-amber-200 hover:bg-amber-200">-</button>
            <input type="number" id="quantityInput" value="1" min="1" class="w-16 text-center py-2 border-t border-b border-amber-200"/>
            <button id="increaseBtn" class="bg-amber-100 text-amber-800 px-4 py-2 rounded-r-md border border-amber-200 hover:bg-amber-200">+</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-amber-900 text-amber-200 py-4">
      <div class="container mx-auto px-4 text-center">
        <p>© 2023 MEEF Kitchen</p>
      </div>
    </footer>
  </div>

  <!-- Interaction script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Flavor cards
      const cards = document.querySelectorAll('.flavor-card');
      cards.forEach(card => {
        card.addEventListener('click', () => {
          cards.forEach(c => c.classList.remove('border-amber-500','bg-amber-50'));
          card.classList.add('border-amber-500','bg-amber-50');
          console.log('Selected flavor:', card.dataset.flavor);
        });
      });

      // Quantity buttons
      const qtyInput = document.getElementById('quantityInput');
      document.getElementById('decreaseBtn').addEventListener('click', () => {
        let v = parseInt(qtyInput.value) || 1;
        if (v > 1) qtyInput.value = v - 1;
        console.log('Quantity:', qtyInput.value);
      });
      document.getElementById('increaseBtn').addEventListener('click', () => {
        let v = parseInt(qtyInput.value) || 1;
        qtyInput.value = v + 1;
        console.log('Quantity:', qtyInput.value);
      });
    });
  </script>
</body>
</html>
