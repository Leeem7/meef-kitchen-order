  <script>
    // 1) Your Apps Script Web App URL:
    const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbw1i_7gdXMG9ZSlyRX00mVw2h7udb8GZ9MAZT0q3qYeQ3TBEP8RT2Uy81uuAtxUPsdYbQ/exec';

    document.addEventListener('DOMContentLoaded', function() {
      // 2) Grab your elements
      let selectedFlavor = null;
      let quantity = 1;
      const pricePerTurkey = 40;
      const flavorCards = document.querySelectorAll('.flavor-card');
      const quantityInput = document.getElementById('quantityInput');
      const decreaseBtn = document.getElementById('decreaseBtn');
      const increaseBtn = document.getElementById('increaseBtn');
      const orderSummary = document.getElementById('orderSummary');
      const totalPrice = document.getElementById('totalPrice');
      const submitOrderBtn = document.getElementById('submitOrder');
      const confirmationModal = document.getElementById('confirmationModal');
      const confirmationDetails = document.getElementById('confirmationDetails');
      const editOrderBtn = document.getElementById('editOrder');
      const confirmOrderBtn = document.getElementById('confirmOrder');
      const successModal = document.getElementById('successModal');
      const closeSuccessBtn = document.getElementById('closeSuccess');

      // 3) Flavor card click
      flavorCards.forEach(card => {
        card.addEventListener('click', function() {
          flavorCards.forEach(c => {
            c.classList.remove('border-amber-500','bg-amber-50');
            c.querySelector('.flavor-checkbox').innerHTML = '';
          });
          this.classList.add('border-amber-500','bg-amber-50');
          this.querySelector('.flavor-checkbox').innerHTML = '<div class="w-3 h-3 bg-amber-500 rounded-full"></div>';
          selectedFlavor = this.getAttribute('data-flavor');
          updateOrderSummary();
        });
      });

      // 4) Quantity buttons
      decreaseBtn.addEventListener('click', () => {
        if (quantity>1) { quantity--; quantityInput.value = quantity; updateOrderSummary(); }
      });
      increaseBtn.addEventListener('click', () => {
        quantity++; quantityInput.value = quantity; updateOrderSummary();
      });
      quantityInput.addEventListener('change', () => {
        quantity = parseInt(quantityInput.value) || 1;
        if (quantity<1) { quantity =1; quantityInput.value=1; }
        updateOrderSummary();
      });

      // 5) Update summary function
      function updateOrderSummary() {
        if (selectedFlavor) {
          const total = pricePerTurkey * quantity;
          orderSummary.innerHTML = `
            <div class="mb-2">
              <div class="flex justify-between">
                <span>${quantity} × ${selectedFlavor} Smoked Turkey</span>
                <span>$${total.toFixed(2)}</span>
              </div>
            </div>`;
          totalPrice.textContent = `$${total.toFixed(2)}`;
        } else {
          orderSummary.innerHTML = '<p class="text-gray-500 italic">No items selected yet</p>';
          totalPrice.textContent = '$0.00';
        }
      }

      // 6) Review → confirmation modal
      submitOrderBtn.addEventListener('click', () => {
        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        const notes = document.getElementById('specialInstructions').value.trim();
        if (!name) { alert('Please enter your name.'); return; }
        if (!phone) { alert('Please enter your phone number.'); return; }
        if (!selectedFlavor) { alert('Please select a flavor.'); return; }
        const total = pricePerTurkey * quantity;
        confirmationDetails.innerHTML = `
          <div class="space-y-3">
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Phone:</strong> ${phone}</p>
            <p><strong>Order:</strong> ${quantity} × ${selectedFlavor} Smoked Turkey</p>
            ${notes ? `<p><strong>Instructions:</strong> ${notes}</p>` : ''}
            <p class="text-lg font-bold mt-4">Total: $${total.toFixed(2)}</p>
          </div>`;
        confirmationModal.classList.remove('hidden');
      });

      // 7) Edit button
      editOrderBtn.addEventListener('click', () => {
        confirmationModal.classList.add('hidden');
      });

      // 8) Confirm → send to Apps Script
      confirmOrderBtn.addEventListener('click', () => {
        const payload = {
          name: document.getElementById('customerName').value.trim(),
          phone: document.getElementById('customerPhone').value.trim(),
          flavor: selectedFlavor,
          quantity,
          instructions: document.getElementById('specialInstructions').value.trim()
        };

        console.log('→ sending', payload);
        fetch(WEBHOOK_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(res => {
          console.log('← status', res.status);
          return res.text();
        })
        .then(text => {
          console.log('← text', text);
          if (text.trim()==='ok') {
            confirmationModal.classList.add('hidden');
            successModal.classList.remove('hidden');
          } else {
            alert('Server replied: ' + text);
          }
        })
        .catch(err => {
          console.error('✖ fetch error', err);
          alert('Network error: ' + err.message);
        });
      });

      // 9) Close success & reset
      closeSuccessBtn.addEventListener('click', () => {
        successModal.classList.add('hidden');
        document.getElementById('customerName').value='';
        document.getElementById('customerPhone').value='';
        document.getElementById('specialInstructions').value='';
        quantity=1; quantityInput.value='1';
        flavorCards.forEach(c => {
          c.classList.remove('border-amber-500','bg-amber-50');
          c.querySelector('.flavor-checkbox').innerHTML='';
        });
        selectedFlavor=null; updateOrderSummary();
      });

    });
  </script>
